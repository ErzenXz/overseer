  <body>
    <script>
      // Opt the page into entrance and scroll animation only when JS runs and
      // the reader has not asked for reduced motion. Runs before first paint.
      if (
        window.matchMedia &&
        window.matchMedia("(prefers-reduced-motion: no-preference)").matches
      ) {
        document.documentElement.classList.add("js-reveal");
      }
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
