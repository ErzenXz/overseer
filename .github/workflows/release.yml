name: Release

# Tag a commit to cut a release:
#   git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags: ['v*']

permissions:
  contents: write # needed to create the release and upload assets

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build UI + cross-compile binaries
        run: make cross VERSION=${{ github.ref_name }}

      - name: Package archives
        run: |
          cd dist
          for f in overseer_*; do
            tar -czf "$f.tar.gz" "$f"
          done
          sha256sum overseer_* > checksums.txt
          ls -la

      # Raw binaries (overseer_<os>_<arch>) are uploaded alongside archives so
      # the hub's installer can fetch them directly from
      # /releases/latest/download/overseer_<os>_<arch>.
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/overseer_*
            dist/checksums.txt
