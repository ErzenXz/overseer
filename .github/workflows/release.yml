name: Release

# Tag a commit to cut a release:
#   git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags: ['v*']

permissions:
  contents: write # needed to create the release and upload assets
  id-token: write # signed GitHub build provenance
  attestations: write
  artifact-metadata: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Test before publishing anything
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq tmux
          go vet ./...
          go test ./...

      - name: Build UI + cross-compile binaries
        run: make cross VERSION=${{ github.ref_name }}

      # The updater refuses a binary whose `version` output differs from the
      # release tag, so check that here instead of on users' machines.
      - name: Smoke-test the Linux binary reports the tag
        run: |
          got="$(./dist/overseer_linux_amd64 version)"
          [ "$got" = "overseer ${{ github.ref_name }}" ] || { echo "binary reports '$got', expected 'overseer ${{ github.ref_name }}'"; exit 1; }

      - name: Package archives
        run: |
          cd dist
          rm -f -- *.tar.gz checksums.txt
          for f in overseer_darwin_* overseer_linux_* overseer_windows_*; do
            tar -czf "$f.tar.gz" "$f"
          done
          sha256sum overseer_darwin_* overseer_linux_* overseer_windows_* > checksums.txt
          ls -la

      - name: Attest release binaries
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/overseer_darwin_*
            dist/overseer_linux_*
            dist/overseer_windows_*

      # Raw binaries (overseer_<os>_<arch>) are uploaded alongside archives so
      # the hub's installer can fetch them directly from
      # /releases/latest/download/overseer_<os>_<arch>.
      - name: Release notes from CHANGELOG.md
        run: |
          sh scripts/release-notes.sh "${{ github.ref_name }}" > dist/RELEASE_NOTES.md
          printf '\n---\n\n[Full changelog](https://overseer.sh/changelog/) · install or update: https://overseer.sh\n' >> dist/RELEASE_NOTES.md

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          body_path: dist/RELEASE_NOTES.md
          generate_release_notes: true
          # Tags like v1.2.0-rc.1 are previews; the updater only follows stable vX.Y.Z.
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/overseer_*
            dist/checksums.txt
